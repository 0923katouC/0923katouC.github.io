<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">额度保卫战</title><desc id="desc">霓虹绿夜班控制台，虚构额度45%，三个任务卡和橙色重置按钮。</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d7f88b" stroke-opacity=".035"/></pattern><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151b22"/><stop offset="1" stop-color="#0c1019"/></linearGradient></defs><rect width="1200" height="720" fill="url(#bg)"/><rect width="1200" height="720" fill="url(#grid)"/><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="70" y="76" fill="#d7f88b" font-size="18" font-weight="700" letter-spacing="4">CMC / NIGHT SHIFT ARCADE</text><text x="70" y="151" fill="#f1f1df" font-size="58" font-weight="900">额度<tspan fill="#d7f88b">保卫战</tspan></text><text x="72" y="186" fill="#a1a9b7" font-size="18">那个神秘按钮，总想再给你补满。</text><g transform="translate(71 232)"><rect y="10" width="1058" height="314" rx="20" fill="#070b10"/><rect width="1058" height="314" rx="20" fill="#1b222d" stroke="#424a57"/><path d="M776 0v314" stroke="#424a57"/><text x="32" y="38" fill="#929dab" font-size="13" letter-spacing="3">FICTIONAL ALLOWANCE</text><text x="30" y="171" fill="#d7f88b" font-family="monospace" font-size="138" font-weight="700">45<tspan font-size="40" fill="#a1a9b7">%</tspan></text><rect x="32" y="199" width="710" height="29" rx="4" fill="#0b1018" stroke="#37414f"/><rect x="38" y="205" width="314" height="17" fill="#d7f88b"/><rect x="316" y="198" width="71" height="31" fill="#d7f88b" fill-opacity=".2" stroke="#f1f1df"/><text x="312" y="252" fill="#d7f88b" font-size="12">40—50 · 下班区</text><text x="34" y="286" fill="#a1a9b7" font-size="12">热量 ▰ ▰ ▱ ▱ ▱ ▱ ▱</text><text x="337" y="286" fill="#83d8ba" font-size="12">护盾 ⬡</text><circle cx="822" cy="44" r="15" fill="#ffab70"/><text x="852" y="49" fill="#ffab70" font-family="monospace" font-size="14" letter-spacing="2">RESET WATCH</text><text x="809" y="115" fill="#f1f1df" font-size="28" font-weight="700">下回合重置</text><text x="809" y="153" fill="#a1a9b7" font-size="16">准备护盾，守住最后一班。</text><rect x="807" y="185" width="216" height="77" rx="8" fill="#ffab7009" stroke="#725946"/><text x="826" y="215" fill="#ffab70" font-size="13">神秘按钮</text><text x="826" y="245" fill="#ffab70" font-size="23" font-family="monospace">+26%</text></g><g transform="translate(72 578)"><rect width="324" height="94" rx="10" fill="#273226" stroke="#637448"/><text x="22" y="37" fill="#f1f1df" font-size="21" font-weight="700">认真干一票</text><text x="22" y="68" fill="#d7f88b" font-size="16">−12 额度 / +2 热量</text><rect x="365" width="324" height="94" rx="10" fill="#203333" stroke="#496e67"/><text x="387" y="37" fill="#f1f1df" font-size="21" font-weight="700">重置绝缘罩</text><text x="387" y="68" fill="#83d8ba" font-size="16">拦下那只手</text><rect x="730" width="324" height="94" rx="10" fill="#252d41" stroke="#546077"/><text x="752" y="37" fill="#f1f1df" font-size="21" font-weight="700">摸鱼冷却</text><text x="752" y="68" fill="#aebfe7" font-size="16">机器也需要喘口气</text></g><text x="1064" y="104" fill="#d7f88b" font-size="70" text-anchor="middle">↻</text><text x="1063" y="151" fill="#a1a9b7" font-family="monospace" font-size="12" text-anchor="middle">100% FICTIONAL</text></g></svg>
