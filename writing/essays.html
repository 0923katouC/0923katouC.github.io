  <main>
    <section class="container page-head compact-head"><a class="back-link" href="/writing.html" data-zh="← 码字集" data-en="← Writing">← 码字集</a><h1 data-zh="随笔" data-en="Essays">随笔</h1><p data-zh="该目录需要邀请码。" data-en="This archive requires an invitation code.">该目录需要邀请码。</p></section>

    <section id="essay-gate" class="container gate-wrap" aria-labelledby="gate-title">
      <div class="gate-card">
        <span class="gate-symbol" aria-hidden="true">⌁</span>
        <h2 id="gate-title" data-zh="邀请码访问" data-en="Invitation access">邀请码访问</h2>
        <p data-zh="请输入 6 位邀请码。本次浏览会话验证成功后无需重复输入。" data-en="Enter the 6-digit invitation code. Access remains unlocked for this browser session.">请输入 6 位邀请码。本次浏览会话验证成功后无需重复输入。</p>
        <form id="invite-form" class="invite-form" autocomplete="off">
          <label for="invite-code" data-zh="邀请码" data-en="Invitation code">邀请码</label>
          <div class="invite-row"><input id="invite-code" name="invite-code" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off" required><button type="submit" data-zh="进入" data-en="Enter">进入</button></div>
          <p id="invite-status" class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="essay-content" class="container protected-content" hidden>
      <div class="unlocked-note"><span data-zh="访问已解锁" data-en="Access unlocked">访问已解锁</span></div>
      <div class="placeholder-block"><p data-zh="随笔条目待补充。" data-en="Essay entries to be added.">随笔条目待补充。</p></div>
    </section>
